name: VENTURE CI

# Manual or PR-only: avoids consuming Actions minutes on every push.
on:
  workflow_dispatch:
  pull_request:
    paths: ["venture/**", ".github/workflows/venture-ci.yml"]

defaults:
  run:
    working-directory: venture

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: venture/package-lock.json
      - run: npm ci
      - name: Start Supabase (local stack)
        run: npx supabase start
      - name: Write .env.local from the local stack
        run: |
          npx supabase status -o env > /tmp/sb.env
          . /tmp/sb.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
          } > .env.local
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
